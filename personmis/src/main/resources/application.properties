# ===================== 基础服务配置 =====================
# 应用监听端口（浏览器/前端请求的后端端口）
server.port=8443
# 服务上下文路径：所有接口都会带上此前缀，例如 /personmis/getStaffByPage
server.servlet.context-path=/personmis

# ===================== 数据库配置（MySQL） =====================
# JDBC 连接串：数据库名 personmis，utf8 编码
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/personmis?characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

# ===================== MyBatis 配置 =====================
# 实体别名包：Mapper.xml 里可以直接使用实体名（如 WelfarePoints）
mybatis.type-aliases-package=com.ch.personmis.entity
# Mapper XML 扫描路径：resources/mappers/*.xml
mybatis.mapperLocations=classpath:mappers/*.xml

# 开启下划线到驼峰自动映射：如 staff_id -> staffId（或 staff_id -> staff_id 视实体字段而定）
mybatis.configuration.map-underscore-to-camel-case=true

# ===================== 日志配置 =====================
# 打印 repository 层 SQL/参数（调试用）
logging.level.com.ch.personmis.repository=debug

# ===================== JSON 输出配置 =====================
# 输出格式化（开发调试友好；生产环境可关闭以减少体积）
spring.jackson.serialization.indent-output=true

# ===================== Spring Security 默认账号（如启用 basic auth） =====================
spring.security.user.name=admin
spring.security.user.password=admin




